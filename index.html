<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">

  <title>Pokédex</title>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <h1>Pokédex</h1>

  <!-- Search Function -->
  <input type="text" id="search" placeholder="Search for a Pokémon...">

  <!-- Type Filter -->
  <div id="type-filter"></div>

  <!-- No Results Message -->
  <p id="no-results">No Pokémon were found.</p>

  <!-- Pokémon Container -->
  <div id="pokemon"></div>

  <!-- Loading Spinner while fetching data -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Pokémon...</p>
  </div>

  <!-- Pokémon Detail Popup -->
  <div id="pokemon-popup-container">
    <div id="pokemon-popup">
      <button id="pokemon-popup-close">✕</button>
      <div id="pokemon-popup-info"></div>
    </div>
  </div>
</body>

</html>
